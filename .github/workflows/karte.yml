name: Karte zeichnen

on:
  schedule:
    - cron: "23 */6 * * *"   # alle 6 Stunden
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karte
  cancel-in-progress: false

jobs:
  karte:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node download-world.mjs
        env:
          ONLY_MAP: "true"
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
      - name: Karte rendern
        run: node render-map.mjs download map
      - name: Karte speichern
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add map
          git diff --cached --quiet && exit 0
          git commit -m "Karte aktualisiert"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
