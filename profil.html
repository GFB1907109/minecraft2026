<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil · Minecraft 2026</title>
<meta name="description" content="Spielerprofil auf Minecraft 2026.">
<meta name="theme-color" content="#1c1426">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="profil">
<a class="skip" href="#inhalt">Zum Inhalt</a>
<header class="top" id="top"></header>
<main id="inhalt">

<section class="page-head"><div class="wrap">
  <div class="profile-top">
    <img class="skin" id="pSkin" alt="">
    <div style="display:grid;gap:12px;min-width:0">
      <span class="eyebrow" id="pState">Spielerprofil</span>
      <h1 id="pName" style="overflow-wrap:anywhere">…</h1>
      <div class="facts" id="pFacts"></div>
      <div class="pnav" id="pNav"></div>
    </div>
  </div>
</div></section>
<div id="pEmpty"></div>
<div id="pMain">
<section class="block-sec"><div class="wrap"><h3 class="sub">Abzeichen</h3><div class="badges" id="pBadges"></div></div></section>
<section class="block-sec"><div class="wrap"><div class="prof-grid">
  <div style="display:grid;gap:16px;align-content:start">
    <div class="panel"><h3 class="sub">Zustand</h3><div class="vitals" id="pVitals"></div></div>
    <div class="panel"><h3 class="sub">Inventar</h3><div class="invwrap" id="pInv"></div></div>
  </div>
  <div style="display:grid;gap:16px;align-content:start">
    <div class="panel"><h3 class="sub">Ender-Truhe</h3><div class="invwrap" id="pEnder"></div></div>
    <div class="panel"><h3 class="sub">Letzte Tode</h3><div class="feed" id="pDeaths"></div></div>
    <div class="panel"><h3 class="sub">Letzte Sessions</h3><div class="feed" id="pSessions"></div></div>
  </div>
</div></div></section>
<section class="block-sec"><div class="wrap"><div class="panel"><h3 class="sub">Neueste Fortschritte <a href="erfolge.html">Alle Erfolge →</a></h3><div id="pAdv"></div></div></div></section>
<section class="block-sec"><div class="wrap"><div class="panel card-body" style="padding:18px" id="pStats"></div></div></section>
</div>

</main>
<footer id="foot"></footer>

<script src="assets/app.js"></script>
</body>
</html>
